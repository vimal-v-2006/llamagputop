<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>llamagputop</title>
<style>
:root{
  --bg:#0a0e12; --card:#10161c; --card2:#131b22; --line:#1e2a33;
  --fg:#d7e2d9; --dim:#6f8291; --faint:#46586a;
  --ok:#3fb950; --warn:#d29922; --crit:#f85149; --ser:#58a6ff;
  --mono:ui-monospace,"SFMono-Regular","Cascadia Mono","JetBrains Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--mono);font-size:13px}
body{padding:14px 16px 40px}
a{color:var(--ser);text-decoration:none}

/* header */
header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;padding:4px 2px 12px;border-bottom:1px solid var(--line);margin-bottom:14px}
header h1{font-size:16px;margin:0;font-weight:600;letter-spacing:.5px}
header h1 b{color:var(--ok)}
.hstat{color:var(--dim);font-size:12px}
.spacer{flex:1}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{background:transparent;border:0;color:var(--dim);font-family:var(--mono);font-size:12px;padding:4px 10px;cursor:pointer}
.seg button.on{background:#1a242c;color:var(--fg)}
#dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--faint);margin-right:6px;vertical-align:1px}
#dot.on{background:var(--ok);box-shadow:0 0 6px var(--ok)}
#dot.gen{background:var(--ser);box-shadow:0 0 6px var(--ser);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.45}}

/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px 12px;min-width:0}
.card h2{font-size:12px;margin:0 0 8px;color:var(--dim);text-transform:uppercase;letter-spacing:1.2px;font-weight:600;display:flex;justify-content:space-between;align-items:baseline}
.card h2 .right{color:var(--faint);text-transform:none;letter-spacing:0;font-weight:400;font-size:11px}
.tag{font-size:11px;padding:1px 7px;border-radius:9px;border:1px solid var(--line);color:var(--dim)}
.tag.gen{color:#0a0e12;background:var(--ser);border-color:var(--ser);font-weight:700}
.tag.idle{color:var(--dim)}
.tag.dead{color:var(--crit);border-color:var(--crit)}
.tag.stale{color:var(--warn);border-color:var(--warn)}

/* metric rows */
.mrow{display:flex;align-items:center;gap:8px;padding:2.5px 0;flex-wrap:wrap}
.mrow .k{color:var(--dim);min-width:74px}
.mrow .v{min-width:0}
.bar{flex:1;height:8px;background:#161e26;border-radius:4px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;border-radius:4px;background:var(--ok);transition:width .5s}
.bar i.warn{background:var(--warn)} .bar i.crit{background:var(--crit)}
.num{margin-left:8px;white-space:nowrap}
.ok{color:var(--ok)} .warn{color:var(--warn)} .crit{color:var(--crit)} .dim{color:var(--dim)} .ser{color:var(--ser)}
.kv{color:var(--dim);font-size:11px}

/* llama speed line */
.speed{display:flex;gap:16px;flex-wrap:wrap;padding:4px 0 6px}
.speed .cell .k{color:var(--dim);font-size:11px}
.speed .cell .v{font-size:15px;font-weight:600}
.speed .cell .v small{font-size:11px;color:var(--dim);font-weight:400}
.med{font-size:11px;color:var(--faint)}

/* config */
.cfg{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:12px;padding-top:2px}
.cfg span{white-space:nowrap}
.cfg .g{color:var(--faint)}
.cfg .f{color:var(--dim)}
.cfg .val{color:var(--fg)}

/* trends */
.trends{margin-top:12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px}
.chart-card{padding-bottom:8px}
canvas{width:100%;height:84px;display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--dim);padding-top:4px}
.legend .sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:0}
.chart-note{color:var(--faint);font-size:11px;margin-top:2px}
footer{margin-top:18px;color:var(--faint);font-size:11px;text-align:center}
.empty{color:var(--faint);padding:6px 0}
</style>
</head>
<body>
<header>
  <h1>llama<b>gputop</b> <span class="hstat">web</span></h1>
  <span class="hstat"><span id="dot"></span><span id="status">connecting…</span></span>
  <span class="hstat" id="uptime"></span>
  <span class="spacer"></span>
  <span class="hstat">refresh</span>
  <div class="seg" id="rates">
    <button data-r="0.5">0.5s</button>
    <button data-r="1" class="on">1s</button>
    <button data-r="2">2s</button>
    <button data-r="5">5s</button>
  </div>
</header>

<div class="grid" id="grid"></div>

<div class="trends">
  <div class="card chart-card">
    <h2>gpu utilisation <span class="right">% over time</span></h2>
    <canvas id="c-gpu"></canvas>
    <div class="legend" id="l-gpu"></div>
  </div>
  <div class="card chart-card">
    <h2>system power <span class="right">watts</span></h2>
    <canvas id="c-pwr"></canvas>
    <div class="chart-note" id="n-pwr"></div>
  </div>
  <div class="card chart-card">
    <h2>llama generation <span class="right">tokens/s</span></h2>
    <canvas id="c-llm"></canvas>
    <div class="legend" id="l-llm"></div>
  </div>
</div>

<footer>llamagputop web · same collectors as the terminal monitor · stdlib only</footer>

<script>
"use strict";
const $ = s => document.querySelector(s);
const fmt = (n,d=0) => n==null ? "—" : Number(n).toLocaleString(undefined,{maximumFractionDigits:d,minimumFractionDigits:0});
const esc = s => String(s??"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const COLORS = ["#3fb950","#58a6ff","#d29922","#f85149","#bc8cff","#39d353","#ff7b72","#79c0ff"];

function barCls(frac, warn=.8, crit=.92){ return frac>=crit?"crit":frac>=warn?"warn":""; }
function bar(label, val, total, unit, opts={}){
  const frac = total ? Math.max(0, Math.min(1, val/total)) : 0;
  const txt = opts.text || `${fmt(val,opts.dec??0)}${unit}`;
  return `<div class="mrow"><span class="k">${label}</span><span class="bar"><i class="${barCls(frac,...(opts.th||[.8,.92]))}" style="width:${(frac*100).toFixed(1)}%"></i></span><span class="num">${txt}</span></div>`;
}
function line(label, val, cls=""){ if(val==null||val==="") return ""; return `<div class="mrow"><span class="k">${label}</span><span class="v ${cls}">${val}</span></div>`; }

/* ------------------------------------------------- panels */
function gpuCard(s, i){
  const temps = Object.entries(s.temp||{}).map(([k,v])=>`<span class="kv">${esc(k)} ${fmt(v)}°C</span>`).join(" · ");
  const vram = s.vram_total ? bar("vram", s.vram_used, s.vram_total, "", {text:`${fmt(s.vram_used)}/${fmt(s.vram_total)} MiB`}) : line("vram","—");
  return `<div class="card">
    <h2>${esc(s.vendor)} ${esc(s.model||"")} <span class="right">${esc(s.backend_dev||"")} ${esc(s.pci_addr||"")}</span></h2>
    ${bar("util", s.util??0, 100, "%", {text: s.util==null?"—":`${fmt(s.util)}%`})}
    ${vram}
    ${line("temp", temps?temps:null, temps?"dim":"")}
    ${line("power", s.power==null?null:`${fmt(s.power)}${s.power_cap?`<span class="dim">/${fmt(s.power_cap)}</span>`:""} W`)}
    ${line("clock", s.clock?`${fmt(s.clock)} MHz`:null)}
    ${line("fan", s.fan?`${s.fan}%`:null)}
    ${s.pcie?line("pcie", `${fmt(s.pcie.gbs,2)} GB/s · x${s.pcie.width}${s.pcie.bottleneck?' <span class="warn">narrow</span>':""}`):""}
    ${s.throttle_reasons?line("throttle", esc(s.throttle_reasons), "warn"):""}
  </div>`;
}

function cpuCard(c){
  if(!c) return "";
  const temps = Object.entries(c.temps||{}).map(([k,v])=>`<span class="kv">${esc(k)} ${fmt(v)}°C</span>`).join(" · ");
  const la = (c.load||[]).join(" ");
  return `<div class="card">
    <h2>CPU <span class="right">${esc(c.name||"")} · ${c.ncpu||""} threads</span></h2>
    ${bar("use", c.util??0, 100, "%", {text: c.util==null?"—":`${fmt(c.util)}%`})}
    ${line("freq", c.freq?`${fmt(c.freq)} MHz`:null)}
    ${line("temp", temps||null, "dim")}
    ${line("power", c.power!=null?`${fmt(c.power)} W`:(c.rapl_present?'<span class="dim">— needs root</span>':null))}
    ${line("load", la||null)}
  </div>`;
}

function memCard(m){
  const used = m.total - m.free;
  const cls = m.free<1200?"crit":m.free<2500?"warn":"";
  return `<div class="card">
    <h2>memory</h2>
    <div class="mrow"><span class="k">ram</span><span class="bar"><i class="${cls}" style="width:${(100*used/Math.max(1,m.total)).toFixed(1)}%"></i></span><span class="num"><span class="${cls}">${fmt(m.free)} free</span> / ${fmt(m.total)} MiB</span></div>
    ${line("cached", `${fmt(m.cached)} MiB`)}
    ${line("buffers", fmt(m.buffers))}
    ${line("dirty", fmt(m.dirty))}
    ${line("committed", `${fmt(m.committed)} MiB`)}
    ${m.swap_total?line("swap", `${fmt(m.swap_used)}/${fmt(m.swap_total)} MiB`):""}
    ${m.zram_orig?line("zram", `${fmt(m.zram_orig)}→${fmt(m.zram_compr)} MiB (${m.zram_ratio}x)`):""}
  </div>`;
}

function powerCard(st){
  const parts = st.gpus.filter(s=>s.power!=null).map(s=>[s.vendor, s.power, s.power_cap]);
  if(st.cpu && st.cpu.power!=null) parts.push(["CPU", st.cpu.power, null]);
  let rows = parts.map(([l,w,cap])=>`<div class="mrow"><span class="k">${esc(l)}</span><span class="num ${w/(cap||300)>=.95?"crit":w/(cap||300)>=.8?"warn":""}">${fmt(w)}${cap?`<span class="dim">/${fmt(cap)}</span>`:""} W</span></div>`).join("");
  if(!rows) rows = `<div class="empty">no readable power sensors</div>`;
  return `<div class="card">
    <h2>power</h2>
    ${rows}
    <div class="mrow"><span class="k">total</span><span class="num" style="font-size:15px;font-weight:700">${st.total_power_w==null?"—":fmt(st.total_power_w)+" W"}</span></div>
    ${line("avg", st.power_avg_w?`${fmt(st.power_avg_w)} W`:null)}
    ${line("session", st.energy_wh?`${fmt(st.energy_wh,1)} Wh`:null)}
    ${line("efficiency", st.eff_t_per_kw?`${fmt(st.eff_t_per_kw,1)} tok/s per kW`:"")}
  </div>`;
}

function llamaCard(d, cfg){
  const phase = d.phase || (d.alive?"off":"dead");
  const tagCls = phase==="generating"?"gen":phase==="prefill"?"stale":d.alive?"idle":"dead";
  const speed = [];
  const sp = (k,cur,last,dec)=>{
    let v, cls;
    if(cur!=null){ v=`${cur.toFixed(dec)}`; cls=""; }
    else if(last!=null){ v=`${last.toFixed(dec)} <small>(last)</small>`; cls="dim"; }
    else { v="—"; cls="dim"; }
    speed.push(`<div class="cell"><div class="k">${k}</div><div class="v ${cls}">${v}<small> t/s</small></div></div>`);
  };
  sp("prefill", d.pp, d.pp_last, 0);
  sp("gen", d.tg, d.tg_last, 1);
  const ctxTxt = (d.kv!=null && d.kv_cap) ? `KV ${ (d.kv*100).toFixed(1) }% (${fmt(d.kv_used)}/${fmt(d.kv_cap||d.ctx)} tok)` : (d.ctx?`ctx ${fmt(d.ctx)} tok`:"");
  let kv = "";
  if(d.kv!=null){
    const fr = d.kv;
    kv = bar("kv", d.kv, 1, "", {text:`${(d.kv*100).toFixed(1)}%`, th:[.85,.95]});
  }
  const reuse = d.reuse!=null?` · reuse ${(d.reuse*100).toFixed(1)}%`:null;
  const spec = d.spec!=null?` · spec accept ${(d.spec*100).toFixed(0)}%`:null;
  const life = (d.pp_life||d.tg_life)?` · session ${fmt(d.pp_life)}/${fmt(d.tg_life,1)} t/s`:null;
  let ttft = null;
  if (d.ttft_last != null) {
    const extra = d.ttft_slots > 1 ? ` (${d.ttft_slots} slots, summed)` : " last";
    ttft = d.ttft_last.toFixed(2) + "s" + `<span class="dim">${extra}</span>`;
  }
  const cfgHtml = cfg?`<div class="cfg">${Object.entries(cfg).map(([g,rows])=>
      (rows||[]).map(([fl,v])=>`<span><span class="g">${esc(g)}:</span> <span class="f">${esc(fl)}</span> <span class="val">${esc(v)}</span></span>`).join("")
    ).join("")}</div>`:"";
  return `<div class="card">
    <h2>llama <span class="right">:${d.port}</span></h2>
    <div class="mrow"><span class="k">status</span><span class="tag ${tagCls}">${esc(phase)}</span>
      <span class="kv">${esc(d.model||"")}</span>
      <span class="kv">active ${fmt(d.active)}, queued ${fmt(d.queued)}</span>
      ${d.stale?'<span class="tag stale">stale</span>':""}
    </div>
    <div class="speed">${speed.join("")}</div>
    ${kv}
    ${line("ttft", ttft)}
    ${line("context", ctxTxt)}
    ${line("counters", [reuse, spec, life].filter(Boolean).join("")||null, "kv")}
    ${cfgHtml}
  </div>`;
}

function procCard(p){
  if(!p || !p.length) return "";
  return `<div class="card">
    <h2>llama processes</h2>
    ${p.map(r=>`<div class="mrow"><span class="k">${esc(r.name||"llama-server")}</span><span class="kv">${esc(r.args||"")}</span></div>`).join("")}
  </div>`;
}

/* ------------------------------------------------- charts */
function drawChart(canvas, series, colors, opts={}){
  const dpr = window.devicePixelRatio||1;
  const w = canvas.clientWidth, h = 84;
  canvas.width = w*dpr; canvas.height = h*dpr;
  const ctx = canvas.getContext("2d"); ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,w,h);
  let all = series.flatMap(s=>s).filter(v=>v!=null&&isFinite(v));
  if(!all.length) return;
  let max = opts.fixedMax || Math.max(...all);
  if(max<=0) max=1;
  ctx.lineWidth=1; ctx.strokeStyle="#1e2a33";
  for(let i=1;i<4;i++){ const y=h*i/4; ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke(); }
  series.forEach((s,si)=>{
    ctx.strokeStyle = colors[si%colors.length]; ctx.lineWidth = 1.6;
    ctx.beginPath(); let started=false;
    s.forEach((v,i)=>{
      if(v==null||!isFinite(v)) return;
      const x = w*i/Math.max(1,(s.length-1));
      const y = h-4 - (h-10)*(Math.min(v,max)/max);
      started?ctx.lineTo(x,y):(ctx.moveTo(x,y),started=true);
    });
    ctx.stroke();
  });
  return max;
}
function legend(el, names, colors){
  el.innerHTML = names.map((n,i)=>`<span><span class="sw" style="background:${colors[i%colors.length]}"></span>${esc(n)}</span>`).join(" ");
}

/* ------------------------------------------------- poll */
let rate = 1;
let last = null;
$("#rates").addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  rate = parseFloat(b.dataset.r);
  document.querySelectorAll("#rates button").forEach(x=>x.classList.toggle("on",x===b));
  poll();
});

async function poll(){
  try{
    const r = await fetch("/api/state",{cache:"no-store"});
    last = await r.json();
    render(last);
    $("#dot").className = last.llamas.some(d=>d.phase==="generating")?"gen":"on";
    $("#status").textContent = "live · " + new Date(last.tick_at*1000).toLocaleTimeString();
  }catch(e){
    $("#dot").className = "";
    $("#status").textContent = "disconnected";
  }
  setTimeout(poll, rate*1000);
}

function render(st){
  const up = st.server_started ? (Date.now()/1000 - st.server_started) : 0;
  const hh = Math.floor(up/3600), mm = Math.floor(up%3600/60), ss = Math.floor(up%60);
  $("#uptime").textContent = `${hh}h ${String(mm).padStart(2,"0")}m ${String(ss).padStart(2,"0")}s up`;
  let html = st.gpus.map(gpuCard).join("") + cpuCard(st.cpu) + memCard(st.mem) + powerCard(st);
  html += st.llamas.map(d=>llamaCard(d, st.cfgs[d.port]||null)).join("");
  html += procCard(st.procs);
  $("#grid").innerHTML = html;
  // charts
  const g = st.gpus.length, names=[];
  const gpuS = [];
  for(let i=0;i<g;i++){ const k=`gpu${i}_util`; if(st.hist[k]){ gpuS.push(st.hist[k]); names.push(st.gpus[i]?st.gpus[i].vendor+" "+(st.gpus[i].model||""):`gpu${i}`);} }
  drawChart($("#c-gpu"), gpuS, COLORS, {fixedMax:100});
  legend($("#l-gpu"), names, COLORS);
  if(st.hist.power_series){
    const mx = drawChart($("#c-pwr"), [st.hist.power_series], ["#d29922"]);
    $("#n-pwr").textContent = `${fmt(st.total_power_w)} W now · ${mx?fmt(mx)+" W peak":""}`;
  }
  const llS=[], llN=[];
  for(const d of st.llamas){
    const k=`tg_series@${d.port}`;
    if(st.hist[k]){ llS.push(st.hist[k]); llN.push(`:${d.port} ${esc(d.model||"")}`); }
  }
  drawChart($("#c-llm"), llS, COLORS);
  legend($("#l-llm"), llN, COLORS);
}

poll();
</script>
</body>
</html>
